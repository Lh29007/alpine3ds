name: alpine-linux-3ds

on:
  push:
    branches: [main]
    paths:
      - "rootfs/**"
      - "scripts/**"
      - ".github/workflows/build-linux.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Dependances
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cpio zip jq curl gcc-arm-none-eabi binutils-arm-none-eabi build-essential python3-pip

      - name: firmtool (pour le loader)
        run: sudo pip3 install --break-system-packages git+https://github.com/TuxSH/firmtool.git && command -v firmtool

      - name: Construire le bundle SD (log capture)
        shell: bash
        run: |
          mkdir -p logs
          set -o pipefail
          sudo -E bash scripts/build-bundle.sh 2>&1 | tee logs/linux-build.log

      - name: Archiver le bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: alpine3ds-sd
          path: dist/

      - name: Publier le log dans le depot
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f logs/linux-build.log
          if git diff --cached --quiet; then
            echo "Log inchange."
            exit 0
          fi
          git commit -m "ci: log linux ${GITHUB_SHA::7} [skip ci]"
          for i in 1 2 3 4 5; do
            if git pull -q --rebase origin main && git push origin HEAD:main; then
              echo "Log publie (tentative $i)."
              exit 0
            fi
            echo "Push refuse, nouvelle tentative dans 5s..."
            sleep 5
          done
          echo "ERREUR: impossible de publier le log"
          exit 1
